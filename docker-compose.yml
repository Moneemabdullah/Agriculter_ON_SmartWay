version: "3.8"

services:
  server:
    build:
      context: .
      dockerfile: Server/Dockerfile
    container_name: agri-server
    env_file:
      - Server/.env
    environment:
      - NODE_ENV=production
      - PORT=3000
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/v1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - agri-net

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: agri-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - agri-net

  mongo:
    image: mongo:6
    container_name: agri-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agri-net

volumes:
  mongo-data:

networks:
  agri-net:
    driver: bridge
