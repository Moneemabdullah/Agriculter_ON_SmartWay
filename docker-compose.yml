
services:
  server:
    build:
      context: .
      dockerfile: Server/Dockerfile
    container_name: agri-server
    env_file:
      - Server/.env
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: http://localhost
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - agri-net

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: agri-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
    networks:
      - agri-net

networks:
  agri-net:
    driver: bridge